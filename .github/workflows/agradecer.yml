name: Agradecer contribuições

# Comenta no PR mesclado agradecendo a pessoa contribuidora.
# Usa pull_request_target porque PRs de fork só têm token de leitura no
# evento pull_request; como não há checkout nem execução de código do fork,
# só a chamada de API, é seguro.
# Imagem fixada em `ubuntu-24.04`, como nos outros workflows: `ubuntu-latest`
# migra do Ubuntu 24.04 para o 26.04 entre outubro e novembro de 2026
# (actions/runner-images#14748). O `actions/github-script` usado abaixo já roda
# em Node 24 (`using: node24`), o runtime que sobrou nos runners depois da
# descontinuação do Node 20 (23/09/2026).
on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write

jobs:
  agradecer:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04
    steps:
      - name: Comentar agradecimento
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = [
              `Obrigado, @${pr.user.login}, pela contribuição!`,
              '',
              `Seu PR #${pr.number} (${pr.title}) foi mesclado no Cronologia.`,
              'Ajudou o projeto a ficar melhor para todo mundo que usa.',
              '',
              'Para as próximas mudanças, veja o CONTRIBUTING.md.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
