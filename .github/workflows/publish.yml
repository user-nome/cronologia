name: Publicar .deb

# Publica o .deb na GitHub Release correspondente e, junto, o repositório
# APT flat (índices assinados + alias estável do .deb) como assets da mesma
# Release, base: .../releases/latest/download/ (suite ./).
# Gatilhos:
# - push na main: lê package.json → se ainda não existir Release para
#   v<versão>, publica automaticamente (é assim que a versão nova sai);
# - tag v* enviada manualmente (ex.: git push origin v1.0.3), ou
# - Release criada na UI do GitHub, ou
# - execução manual na UI (workflow_dispatch; também serve para reanexar
#   assets de uma Release que falhou no meio).
# Sem loop: pushes de tag/Release feitos com o GITHUB_TOKEN desta execução
# não disparam novos runs, e a tag só é criada antes do upload dos assets.
# `concurrency` serializa as publicações para duas corridas na main não
# publicarem a mesma versão duas vezes.
# Actions fixadas por SHA completo (com a tag na comentário) para não depender
# da segurança da tag movível; o Dependabot (`github-actions`) atualiza os pins.
# Todas declararam `using: node24`: o Node 20 foi descontinuado e saiu dos
# runners em 23/09/2026, então action em Node 20 não roda mais — o runner a força
# para Node 24 e avisa a cada execução. `actions/checkout` foi do v4 para o v7
# por causa disso.
#
# Imagem fixada em `ubuntu-24.04` nos três jobs. `ubuntu-latest` é etiqueta móvel
# e o GitHub está migrando o `latest` do Ubuntu 24.04 para o 26.04 entre outubro
# e novembro de 2026 (actions/runner-images#14748); aqui isso derrubaria o
# empacotamento, porque o build do `.deb` resolve dependência pelo nome do
# pacote (`fakeroot`, `dpkg-dev`, `apt-utils`, `gnupg`).
# Gate de qualidade: o job "Verificar qualidade" (npm run check + npm test)
# roda em paralelo ao "Verificar versão" e o "Gerar e publicar" só começa se
# os dois passarem; falha de tipo, lint, formato, auditoria OSV ou teste
# interrompe a publicação.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-deb
  cancel-in-progress: false

# secrets não pode ser usado em `if:`; copia para env (padrão do GitHub).
env:
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
  # Impressão digital da chave que assina o repo APT. Fonte única: ao trocar a
  # chave, atualize este valor e os secrets `GPG_PRIVATE_KEY` e
  # `GPG_PASSPHRASE`. Ela é conferida em três lugares (checagem da chave,
  # `--local-user` nas assinaturas e mensagem de erro), então escrevê-la à mão
  # nos três pontos era um convite para a metade ficar na chave antiga.
  # Ver docs/distribuicao-apt.md.
  GPG_FINGERPRINT: 25300DF604649306F87CDF777DC37BA3C21FFA81

jobs:
  resolver-versao:
    name: Verificar versão
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publicar: ${{ steps.version.outputs.publicar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Comparar package.json com as Releases existentes
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          PUBLICAR=true

          # Ref explícita (tag manual, Release da UI ou dispatch numa tag)
          # manda mais que o package.json.
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          fi

          echo "package.json: $VERSION"
          echo "Tag da Release: $TAG"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "::warning::Tag $TAG não confere com v$VERSION do package.json."
          fi
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md não tem a entrada '## [$VERSION]'."
          fi

          # Push na main: só interessa publicar se ainda não houver Release.
          # (Se a tag existe mas a Release não, publica mesmo assim: é o
          # caso de um run anterior que morreu antes do upload.)
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "branch" ]; then
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" || true)"
            if [ "$CODE" = "200" ]; then
              PUBLICAR=false
              echo "::notice::Release $TAG já existe; nada a publicar nesta execução."
            elif [ "$CODE" != "404" ]; then
              echo "::warning::Não deu para conferir a Release $TAG (HTTP ${CODE:-erro}); seguirei publicando."
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publicar=$PUBLICAR" >> "$GITHUB_OUTPUT"
          echo "Resultado: tag=$TAG publicar=$PUBLICAR"

  qualidade:
    name: Verificar qualidade
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: OSV Scanner (binário fora do git; versão fixada)
        run: |
          set -euo pipefail
          # bin/osv-scanner é gitignored: a pasta não existe no checkout do CI
          # e o curl falharia com exit 23 (não consegue criar o arquivo).
          mkdir -p bin
          curl -fsSL -o bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64
          chmod +x bin/osv-scanner
          bin/osv-scanner --version

      - name: Typecheck + lint + formato + auditoria OSV
        run: npm run check

      - name: Testes (Vitest)
        run: npm test

  build-deb:
    name: Gerar e publicar
    needs: [resolver-versao, qualidade]
    if: needs.resolver-versao.outputs.publicar == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tags completas para conferir/criar a tag da Release
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Dependências do sistema (electron-builder --linux deb)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot

      - run: npm ci

      # Credenciais OAuth dos clientes Desktop (Dropbox e Google Drive).
      #
      # `loadEnv` do electron-vite (`electron.vite.config.mts`) substitui
      # `process.env.DROPBOX_APP_KEY`, `GOOGLE_CLIENT_ID` e
      # `GOOGLE_CLIENT_SECRET` no bundle do processo main, então o que está aqui
      # é o que entra no `.deb`. Os valores nunca vão para o código-fonte: nem
      # literal no repositório, nem `.env` no runner (o `env:` do step é o
      # equivalente do `.env` local, e o job não escreve arquivo nenhum).
      #
      # Secrets e variables do Actions chegam com o mesmo nome. Estas chaves
      # identificam o aplicativo e não são segredos de servidor (clientes
      # Desktop permitem extraí-las do binário), então **Variables** é o lugar
      # certo; `secrets.*` continua sendo aceito para quem já configurou lá. O
      # passo de build escolhe o que estiver preenchido.
      - name: Juntar as credenciais OAuth (Secrets ou Variables)
        id: oauth
        env:
          SEC_DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          SEC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          SEC_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VAR_DROPBOX_APP_KEY: ${{ vars.DROPBOX_APP_KEY }}
          VAR_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VAR_GOOGLE_CLIENT_SECRET: ${{ vars.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Secret tem precedência sobre Variable (mesmo valor em uso hoje, mas
          # a ordem deixa o secret ganhar se alguém declarar os dois).
          pick() { if [ -n "${1:-}" ]; then printf '%s' "$1"; else printf '%s' "${2:-}"; fi; }
          {
            echo "dropbox_app_key=$(pick "$SEC_DROPBOX_APP_KEY" "$VAR_DROPBOX_APP_KEY")"
            echo "google_client_id=$(pick "$SEC_GOOGLE_CLIENT_ID" "$VAR_GOOGLE_CLIENT_ID")"
            echo "google_client_secret=$(pick "$SEC_GOOGLE_CLIENT_SECRET" "$VAR_GOOGLE_CLIENT_SECRET")"
          } >> "$GITHUB_OUTPUT"

          # Falha aqui, e não no app: sem DROPBOX_APP_KEY o binário sai com o
          # provedor desabilitado e ninguém descobre até alguém instalar e
          # tentar conectar. A mensagem diz onde cadastrar.
          if [ -z "$(pick "$SEC_DROPBOX_APP_KEY" "$VAR_DROPBOX_APP_KEY")" ]; then
            echo "::error::DROPBOX_APP_KEY ausente. Cadastre em Settings → Secrets and variables → Actions (aba Secrets ou Variables, escopo Repository) no repo user-nome/cronologia."
            exit 1
          fi
          if [ -z "$(pick "$SEC_GOOGLE_CLIENT_ID" "$VAR_GOOGLE_CLIENT_ID")" ]; then
            echo "::error::GOOGLE_CLIENT_ID ausente. Sem ele o Google Drive é desabilitado no .deb. Cadastre em Settings → Secrets and variables → Actions, ou remova o provider de docs/backup-providers.md se a integração for desativada."
            exit 1
          fi
          # O secret do Google é opcional para o cliente Desktop (PKCE não
          # precisa dele), então ausente não quebra: o build segue sem ele.
          if [ -z "$(pick "$SEC_GOOGLE_CLIENT_SECRET" "$VAR_GOOGLE_CLIENT_SECRET")" ]; then
            echo "::notice::GOOGLE_CLIENT_SECRET ausente; o Google Drive usará só o client_id (aceito para o cliente Desktop)."
          fi
          echo "::notice::Credenciais OAuth prontas (App key do Dropbox e client_id do Google Drive)."

      - name: Gerar .deb (compila e empacota; o upload é no step seguinte)
        # --publish never: sem isso, o electron-builder tenta publicar
        # sozinho por causa da tag ("Implicit publishing") e falha sem token.
        env:
          DROPBOX_APP_KEY: ${{ steps.oauth.outputs.dropbox_app_key }}
          GOOGLE_CLIENT_ID: ${{ steps.oauth.outputs.google_client_id }}
          GOOGLE_CLIENT_SECRET: ${{ steps.oauth.outputs.google_client_secret }}
        run: |
          set -euo pipefail
          npm run build
          npx electron-builder --linux deb --publish never

      - name: Conferir que as credenciais entraram no bundle do main
        env:
          DROPBOX_APP_KEY: ${{ steps.oauth.outputs.dropbox_app_key }}
          GOOGLE_CLIENT_ID: ${{ steps.oauth.outputs.google_client_id }}
          GOOGLE_CLIENT_SECRET: ${{ steps.oauth.outputs.google_client_secret }}
        run: |
          set -euo pipefail
          # O `define` do electron-vite substitui o literal no bundle. Se o
          # valor não estiver lá, o `.deb` sai com o provedor desabilitado e a
          # falha só aparece na máquina de quem instalou: o teste é o `.deb`.
          MAIN="$(ls out/main/index.js)"
          falha=0
          conferir() {
            if [ -z "$2" ]; then
              echo "::notice::$1 não configurado; nada a conferir."
            elif grep -qF "$2" "$MAIN"; then
              echo "::notice::$1 embutida em out/main/index.js."
            else
              echo "::error::$1 configurada mas não apareceu no bundle do main: o provedor sairia desabilitado. Confira o nome da variável em electron.vite.config.mts."
              falha=1
            fi
          }
          conferir DROPBOX_APP_KEY "$DROPBOX_APP_KEY"
          conferir GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          conferir GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          # O mesmo arquivo tem de estar no payload do .deb: empacotar antes de
          # compilar (ou com `afterPack` apagando) é justamente o que faria a
          # chave sumir entre o build e o artefato.
          # O glob pega só um arquivo (o mais recente): em `release/` pode
          # sobrar `.deb` de uma versão anterior, e um `ls` com dois caminhos
          # quebraria o passo inteiro.
          DEB="$(ls -t release/cronologia_*_amd64.deb | head -n 1)"
          PAYLOAD="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$PAYLOAD"
          # O app vai empacotado em `app.asar`, então a conferência desce um
          # nível: o caminho solto `out/main/index.js` não existe no `.deb`.
          # `asar extract` (e não `extract-file`) porque este último escreve o
          # arquivo no diretório atual, e o passo não deve depender do `cwd`.
          ASAR="$(find "$PAYLOAD" -name 'app.asar' -print -quit)"
          if [ -z "$ASAR" ]; then
            echo "::error::app.asar não está no payload de $(basename "$DEB")."
            exit 1
          fi
          npx asar extract "$ASAR" "$PAYLOAD/asar"
          MAIN_DEB="$PAYLOAD/asar/out/main/index.js"
          if [ ! -s "$MAIN_DEB" ]; then
            echo "::error::Não consegui ler out/main/index.js de dentro do app.asar."
            exit 1
          fi
          for chave in "$DROPBOX_APP_KEY" "$GOOGLE_CLIENT_ID"; do
            [ -z "$chave" ] && continue
            grep -qF "$chave" "$MAIN_DEB" \
              || { echo "::error::A credencial embutida em out/ não está no payload do .deb."; falha=1; }
          done
          echo "::notice::Credenciais conferidas dentro do .deb ($(basename "$DEB"))."
          rm -rf "$PAYLOAD"
          exit "$falha"

      - name: Criar tag da Release (se ainda não existir)
        env:
          TAG: ${{ needs.resolver-versao.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::Tag vazia: o job 'Verificar versão' não rodou?"
            exit 1
          fi
          # Identidade do autor: sem user.name/user.email no runner o
          # `git tag -a` aborta com "Please tell me who you are".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG já existe; vou anexar os assets nela."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "Tag $TAG criada no commit $(git rev-parse --short HEAD)."
          fi

      - name: Anexar .deb à Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/cronologia_*_amd64.deb
          # Se a Release ainda não existe (tag manual), ela é criada aqui.
          generate_release_notes: true
          tag_name: ${{ needs.resolver-versao.outputs.tag }}

      - name: Gerar repo APT flat assinado (assets estáveis)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::Secret GPG_PRIVATE_KEY ausente em Settings → Secrets → Actions (repo cronologia)."
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg
          mkdir -p apt
          # Alias estável SEM versão: o APT resolve Filename relativo à base
          # .../releases/latest/download/, que só redireciona nomes exatos.
          cp release/cronologia_*_amd64.deb apt/cronologia_amd64.deb
          # Falhas aqui viram ::error:: explícito (annotations são legíveis
          # na UI do Actions sem precisar abrir o log cru).
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import || true
          # A chave tem de ser exatamente a de `GPG_FINGERPRINT` (uid
          # chronos.biblioteca@proton.me). Conferir pela impressão digital e
          # não pelo uid pega o caso real de rotação: o secret novo e o valor
          # antigo no env não podem combinar em silêncio.
          if ! gpg --list-secret-keys "$GPG_FINGERPRINT" >/dev/null 2>&1; then
            echo "::error::GPG_PRIVATE_KEY não contém a chave $GPG_FINGERPRINT: cole o bloco armoured inteiro, COM as linhas -----BEGIN PGP PRIVATE KEY BLOCK----- e -----END PGP PRIVATE KEY BLOCK----- (sem elas o gpg não reconhece o formato). Se a chave foi renovada, troque também GPG_FINGERPRINT no topo deste arquivo."
            exit 1
          fi
          echo "Chave de assinatura: $GPG_FINGERPRINT"

          # A frase entra por `--passphrase-file` num arquivo temporário, e
          # não por `--passphrase`: o outro caminho põe a frase no argv do
          # processo, legível por qualquer outro usuário da máquina. O `mktemp`
          # cria com 600 e o arquivo é apagado no fim, inclusive quando o passo
          # falha.
          #
          # `--pinentry-mode loopback` é obrigatório: sem ele o agente do gpg
          # tenta pinentry, o runner não tem terminal e a assinatura morre com
          # `Inappropriate ioctl for device`.
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::Secret GPG_PASSPHRASE ausente em Settings → Secrets → Actions (repo user-nome/cronologia). A chave $GPG_FINGERPRINT tem frase, então o CI não consegue desbloquear sem ela: o agente do gpg cairia em pinentry e o runner não tem terminal."
            exit 1
          fi
          umask 077
          PHRASE_FILE="$(mktemp)"
          trap 'shred -u "$PHRASE_FILE" 2>/dev/null || true' EXIT
          printf '%s' "$GPG_PASSPHRASE" > "$PHRASE_FILE"
          GPG_OPTS=(--batch --yes --pinentry-mode loopback --passphrase-file "$PHRASE_FILE")

          # Teste de assinatura antes de gerar qualquer coisa, para falhar com
          # uma mensagem que aponta a causa em vez de dizer só que "não
          # assinou".
          echo preflight > apt/.sign-test
          if ! gpg "${GPG_OPTS[@]}" --local-user "$GPG_FINGERPRINT" --clearsign \
            -o apt/.sign-test.asc apt/.sign-test 2>apt/.sign-test.err; then
            # Diagnóstico: o erro do gpg vem inteiro, sem cortar em uma linha —
            # é a única linha que diz se a frase não confere (Bad passphrase),
            # se o agente caiu em pinentry (Inappropriate ioctl for device) ou
            # se é outra coisa. Comprimento e sha256 dos secrets recebidos
            # permitem comparar com os arquivos locais; o sha256 da string
            # vazia (e3b0c44298fc1c14...) quer dizer secret cadastrado vazio.
            cat apt/.sign-test.err
            echo "GPG_PASSPHRASE recebido: ${#GPG_PASSPHRASE} caracteres, sha256 $(printf '%s' "$GPG_PASSPHRASE" | sha256sum | cut -c1-16)"
            echo "GPG_PRIVATE_KEY recebido: ${#GPG_PRIVATE_KEY} caracteres, sha256 $(printf '%s' "$GPG_PRIVATE_KEY" | sha256sum | cut -c1-16)"
            # Espaço, ENTER ou espaço no fim é o erro mais comum quando a
            # pessoa jura que a frase está certa.
            APARADO="${GPG_PASSPHRASE#"${GPG_PASSPHRASE%%[![:space:]]*}"}"
            APARADO="${APARADO%"${APARADO##*[![:space:]]}"}"
            if [ "$APARADO" != "$GPG_PASSPHRASE" ]; then
              echo "::error::GPG_PASSPHRASE tem espaço ou quebra de linha no começo/fim: cole só a frase, sem ENTER depois."
            else
              echo "::error::Falha ao assinar com a chave $GPG_FINGERPRINT. Confira se GPG_PRIVATE_KEY e GPG_PASSPHRASE correspondem à chave e à frase atuais."
            fi
            exit 1
          fi
          rm -f apt/.sign-test apt/.sign-test.asc apt/.sign-test.err
          cd apt
          dpkg-scanpackages . /dev/null > Packages.raw
          # Filename precisa ser o nome puro do asset (sem ./ nem pool/).
          sed 's#^\(\s*Filename:\s*\)\./#\1#' Packages.raw > Packages
          grep -qx 'Filename: cronologia_amd64.deb' Packages
          gzip -9nc Packages > Packages.gz
          rm Packages.raw
          # Release é gerado FORA da árvore e só então movido para dentro,
          # senão ele hash a si mesmo (arquivo meio escrito) e ao .raw.
          apt-ftparchive release \
            -o APT::FTPArchive::Release::Origin=Cronologia \
            -o APT::FTPArchive::Release::Label=Cronologia \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            -o APT::FTPArchive::Release::Description="Cronologia" \
            . > ../Release.tmp
          mv ../Release.tmp Release
          # `--local-user` nas três operações: o runner é limpo, mas fixar a chave deixa
          # a assinatura atrelada à impressão digital do topo do arquivo, e não
          # a "a primeira chave que o gpg achar". O mesmo vale para o `export`:
          # sem o argumento, `gpg --armor --export` despeja o keyring inteiro no
          # public.key.
          gpg "${GPG_OPTS[@]}" --local-user "$GPG_FINGERPRINT" --clearsign -o InRelease Release
          gpg "${GPG_OPTS[@]}" --local-user "$GPG_FINGERPRINT" -abs -o Release.gpg Release
          gpg --armor --export "$GPG_FINGERPRINT" > public.key
          echo "Repo APT flat gerado (chave $GPG_FINGERPRINT):" && ls -l

      - name: Anexar repo APT à Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            apt/cronologia_amd64.deb
            apt/Packages
            apt/Packages.gz
            apt/Release
            apt/Release.gpg
            apt/InRelease
            apt/public.key
          tag_name: ${{ needs.resolver-versao.outputs.tag }}

      - name: Disparar redeploy da landing (Vercel Deploy Hook)
        # Sem hook configurado, pula em silêncio; a Release funciona igual.
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
