name: CodeQL

# Análise estática de segurança do código (JS/TS) em push/PR para main e
# semanalmente. Complementa o `npm run security:audit` (OSV, dependências).
# Code scanning é gratuito em repositório público; em privado exige GitHub
# Advanced Security. Imagem, Node 24 e pins por SHA: `docs/build.md`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analisar (javascript-typescript)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript

      # Linguagens interpretadas não precisam de build: o analisador
      # varre o fonte diretamente.
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: '/language:javascript-typescript'
